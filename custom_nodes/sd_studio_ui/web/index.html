<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SD Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0a; --panel: #141414; --panel2: #1c1c1c; --border: #2a2a2a;
    --text: #e5e5e5; --dim: #888; --accent: #fff;
    --c-sdxl: #5aa7ff; --c-anima: #ff7ab8; --c-zimage: #6fd66f; --c-unknown: #999;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    font-size: 13px; height: 100vh; display: flex; overflow: hidden;
  }
  /* ---- left: controls ---- */
  #controls {
    width: 380px; min-width: 380px; height: 100vh; overflow-y: auto;
    background: var(--panel); border-right: 1px solid var(--border); padding: 16px;
  }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .1em; margin-bottom: 14px; }
  h1 span { color: var(--dim); font-weight: 400; font-size: 11px; margin-left: 8px; }
  label { display: block; color: var(--dim); font-size: 11px; margin: 12px 0 4px; letter-spacing: .05em; }
  textarea, select, input[type=number], input[type=text] {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px;
    font-size: 13px; font-family: inherit; outline: none;
  }
  textarea:focus, select:focus, input:focus { border-color: #555; }
  textarea { resize: vertical; min-height: 72px; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  button:hover { border-color: #555; }
  #generate {
    width: 100%; margin-top: 16px; padding: 12px; font-size: 14px; font-weight: 600;
    background: var(--accent); color: #000; border: none;
  }
  #generate:disabled { opacity: .4; cursor: default; }
  #interrupt { width: 100%; margin-top: 8px; display: none; }
  /* current model card */
  #modelCard {
    display: flex; gap: 10px; align-items: center; cursor: pointer;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 8px;
  }
  #modelCard:hover { border-color: #555; }
  #modelCard .thumb {
    width: 56px; height: 72px; border-radius: 6px; background: #222 center/cover no-repeat;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 20px; font-weight: 700;
  }
  #modelCard .info { min-width: 0; }
  #modelCard .name {
    font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #modelCard .sub { font-size: 11px; color: var(--dim); margin-top: 3px; }
  .arch-pill {
    display: inline-block; font-size: 10px; padding: 1px 8px; border-radius: 9px;
    border: 1px solid currentColor; margin-right: 6px;
  }
  /* lora rows */
  .lora-row {
    display: flex; gap: 8px; align-items: center; margin-top: 6px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 6px;
  }
  .lora-row .thumb {
    width: 34px; height: 44px; border-radius: 5px; background: #222 center/cover no-repeat; flex-shrink: 0;
  }
  .lora-row .name {
    flex: 1; min-width: 0; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lora-row input[type=number] { width: 64px; }
  .lora-row button { padding: 5px 9px; }
  #addLora { margin-top: 6px; font-size: 12px; padding: 5px 10px; }
  #i2iDrop {
    border: 1px dashed var(--border); border-radius: 8px; padding: 14px;
    text-align: center; color: var(--dim); font-size: 12px; cursor: pointer;
  }
  #i2iDrop:hover { border-color: #555; }
  #i2iBox { display: flex; gap: 10px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  #i2iThumb { width: 76px; height: 76px; object-fit: cover; border-radius: 6px; }
  .i2i-ctl { flex: 1; }
  .i2i-ctl label { margin-top: 0; }
  .i2i-ctl button { margin-top: 6px; font-size: 12px; padding: 4px 10px; }
  .seed-row { display: flex; gap: 8px; align-items: center; }
  .seed-row input[type=number] { flex: 1; }
  .seed-row label.chk { display: flex; align-items: center; gap: 4px; margin: 0; font-size: 12px; color: var(--text); white-space: nowrap; }
  /* progress */
  #progressWrap { margin-top: 12px; height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; display: none; }
  #progressBar { height: 100%; width: 0%; background: var(--accent); transition: width .15s; }
  #status { margin-top: 8px; color: var(--dim); font-size: 11px; min-height: 15px; white-space: pre-wrap; }
  /* ---- right: preview & gallery ---- */
  #main { flex: 1; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #preview { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: hidden; }
  #preview img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  #preview .empty { color: #444; font-size: 13px; letter-spacing: .1em; }
  #gallery {
    height: 120px; min-height: 120px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; padding: 10px; overflow-x: auto; overflow-y: hidden; background: var(--panel);
  }
  #gallery img { height: 100%; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
  #gallery img.sel { border-color: var(--accent); }
  #topbar {
    padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--dim);
  }
  #topbar button { font-size: 11px; padding: 4px 10px; }
  /* ---- picker overlay ---- */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(6px);
    display: none; z-index: 100;
  }
  #overlay.open { display: flex; flex-direction: column; }
  #overlayHead {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 22px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  #overlayTitle { font-size: 14px; font-weight: 600; letter-spacing: .08em; }
  #overlayClose { font-size: 14px; padding: 4px 12px; }
  #overlayBody { flex: 1; overflow-y: auto; padding: 18px 22px; }
  .arch-section { margin-bottom: 22px; }
  .arch-section h2 {
    font-size: 12px; font-weight: 600; letter-spacing: .1em; margin-bottom: 10px;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .card-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;
  }
  .model-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; cursor: pointer; transition: border-color .1s, transform .1s;
  }
  .model-card:hover { border-color: #666; transform: translateY(-2px); }
  .model-card.current { border-color: var(--accent); }
  .model-card .img {
    width: 100%; aspect-ratio: 3/4; background: #1a1a1a center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    color: #555; font-size: 34px; font-weight: 700;
  }
  .model-card .meta { padding: 8px 10px; }
  .model-card .mname {
    font-size: 12px; font-weight: 600; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    word-break: break-all;
  }
  /* ---- recipe panel ---- */
  .chk { display: flex; align-items: center; gap: 5px; margin: 0; font-size: 12px; color: var(--text); }
  #recipeHead { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  #recipeHead .chk { margin-right: auto; }
  #recipeHead button { padding: 4px 9px; font-size: 11px; }
  .slot-row { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
  .slot-name { width: 76px; flex-shrink: 0; font-size: 11px; color: var(--dim); }
  .slot-row.hero {
    background: var(--panel2); border: 1px solid #3d3d3d; border-radius: 8px;
    padding: 7px 7px 7px 9px; margin-bottom: 9px;
  }
  .slot-row.hero .slot-name { color: var(--accent); font-weight: 600; font-size: 12px; }
  .slot-sel { flex: 1; min-width: 0; padding: 5px 6px; font-size: 12px; }
  .slot-edit { padding: 4px 8px; flex-shrink: 0; }
  #drawNote { font-size: 11px; color: var(--dim); margin-top: 7px; min-height: 14px; }
  /* The composed string is the only place the user can see what actually gets
     sent once the hand-written prompt and the recipe draw are joined. */
  #composedWrap { display: none; }
  #composedPreview {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px; font-size: 11px; color: var(--dim); line-height: 1.5;
    max-height: 120px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
  }
  .dim-note { color: var(--dim); font-size: 11px; }
  /* ---- batch runner ---- */
  #batchBox { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  #batchEstimate { font-size: 11px; color: var(--dim); margin-top: 8px; line-height: 1.5; }
  #batchRun { width: 100%; margin-top: 8px; }
  #toReview {
    display: none; margin-top: 8px; text-align: center; color: var(--text);
    font-size: 12px; text-decoration: none; border: 1px solid var(--border);
    border-radius: 6px; padding: 8px;
  }
  #toReview:hover { border-color: #555; }
  /* ---- slot / template editor ---- */
  #editOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.8); backdrop-filter: blur(6px);
    display: none; z-index: 200; align-items: center; justify-content: center; padding: 40px;
  }
  #editOverlay.open { display: flex; }
  #editPanel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    width: min(760px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden;
  }
  #editTitle { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; }
  #editArea {
    flex: 1; min-height: 400px; border: none; border-radius: 0; resize: none;
    font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.65;
  }
  #editFoot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<div id="controls">
  <h1>SD STUDIO<span>local generation</span></h1>

  <label>モデル（クリックで選択画面）</label>
  <div id="modelCard">
    <div class="thumb">?</div>
    <div class="info">
      <div class="name">--</div>
      <div class="sub">読み込み中...</div>
    </div>
  </div>

  <label>LoRA</label>
  <div id="loras"></div>
  <button id="addLora">＋ LoRAを選んで追加</button>

  <label>参照画像 (img2img)</label>
  <div id="i2iDrop">クリックで画像を選択（未設定＝テキストから生成）</div>
  <input type="file" id="i2iFile" accept="image/*" hidden>
  <div id="i2iBox" style="display:none">
    <img id="i2iThumb">
    <div class="i2i-ctl">
      <label>denoise（小=下絵に忠実 / 大=描き直し強）</label>
      <input type="number" id="i2iDenoise" value="0.6" step="0.05" min="0.05" max="1">
      <button id="i2iClear">参照を解除</button>
    </div>
  </div>

  <label>レシピ（要素で組む）</label>
  <div id="recipeHead">
    <label class="chk"><input type="checkbox" id="useRecipe" checked> 使う</label>
    <button id="reroll">🎲 引き直す</button>
    <button id="editTemplate">テンプレ</button>
  </div>
  <div id="recipeBody">
    <div id="slots"></div>
    <div id="drawNote"></div>
  </div>

  <label>プロンプト</label>
  <textarea id="prompt" placeholder="手書き分。レシピONでも書ける（抽選分が後ろに足される）"></textarea>

  <div id="composedWrap">
    <label>実際に送られるプロンプト</label>
    <div id="composedPreview"></div>
  </div>

  <label>ネガティブプロンプト</label>
  <textarea id="negative" placeholder="worst quality, low quality, ...">worst quality, low quality</textarea>

  <div class="row">
    <div>
      <label>幅</label>
      <input type="number" id="width" value="1024" step="64">
    </div>
    <div>
      <label>高さ</label>
      <input type="number" id="height" value="1024" step="64">
    </div>
    <div>
      <label>プリセット</label>
      <select id="preset">
        <option value="">--</option>
        <option value="1024x1024">1:1 (1024)</option>
        <option value="896x1152">3:4 縦</option>
        <option value="1152x896">4:3 横</option>
        <option value="832x1216">2:3 縦</option>
        <option value="1216x832">3:2 横</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div>
      <label>ステップ数</label>
      <input type="number" id="steps" value="25" min="1" max="100">
    </div>
    <div>
      <label>CFG</label>
      <input type="number" id="cfg" value="6.5" step="0.5" min="1">
    </div>
    <div>
      <label>枚数</label>
      <input type="number" id="batch" value="1" min="1" max="8">
    </div>
  </div>

  <div class="row">
    <div>
      <label>サンプラー</label>
      <select id="sampler"></select>
    </div>
    <div>
      <label>スケジューラ</label>
      <select id="scheduler"></select>
    </div>
  </div>

  <label>シード</label>
  <div class="seed-row">
    <input type="number" id="seed" value="0">
    <label class="chk"><input type="checkbox" id="randomSeed" checked> ランダム</label>
  </div>

  <button id="generate">生成</button>
  <button id="interrupt">中断</button>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div id="status"></div>

  <div id="batchBox">
    <label>大量生成（スロットをランダムに組み合わせ）</label>
    <div class="row">
      <div>
        <label>枚数</label>
        <input type="number" id="batchCount" value="60" min="1" max="2000">
      </div>
      <div>
        <label>モード</label>
        <select id="batchMode">
          <option value="rough">ラフ（数を稼ぐ）</option>
          <option value="final">本生成（等倍）</option>
        </select>
      </div>
    </div>
    <div class="row" id="roughOpts">
      <div>
        <label>ラフ倍率</label>
        <input type="number" id="roughScale" value="0.65" step="0.05" min="0.3" max="1">
      </div>
      <div>
        <label>ラフstep</label>
        <input type="number" id="roughSteps" value="14" min="4" max="60">
      </div>
    </div>
    <div id="batchEstimate"></div>
    <button id="batchRun">キューに投入</button>
    <a id="toReview" href="/studio/review">選別ビューを開く</a>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <span id="conn">接続中...</span>
    <span>
      <button onclick="location.href='/studio/review'">選別ビュー</button>
      <button onclick="location.href='/studio/prompt'">詠唱補助装置</button>
      <button id="fetchPreviews">公式サムネ取得 (Civitai)</button>
      <button id="refreshModels">モデル再読込</button>
    </span>
  </div>
  <div id="preview"><div class="empty">NO IMAGE</div></div>
  <div id="gallery"></div>
</div>

<div id="overlay">
  <div id="overlayHead">
    <span id="overlayTitle">モデルを選択</span>
    <button id="overlayClose">閉じる</button>
  </div>
  <div id="overlayBody"></div>
</div>

<div id="editOverlay">
  <div id="editPanel">
    <div id="editTitle"></div>
    <textarea id="editArea" spellcheck="false"></textarea>
    <div id="editFoot">
      <button id="editCancel">キャンセル</button>
      <button id="editSave">保存</button>
    </div>
  </div>
</div>

<script src="/studio/assets/workflow.js"></script>
<script src="/studio/assets/recipe.js"></script>
<script>
const api = API;
const clientId = crypto.randomUUID();

let modelData = null;
let current = null;   // {kind, arch, name}
let lastArch = null;

const imgUrlFor = (kind, name) =>
  `${api}/studio/api/model_image?kind=${kind}&name=${encodeURIComponent(name)}`;

// ---------- data ----------
async function loadModels(keepSelection) {
  const [models, ksRes] = await Promise.all([
    fetch(`${api}/studio/api/models`).then(r => r.json()),
    fetch(`${api}/object_info/KSampler`).then(r => r.json()),
  ]);
  modelData = models;
  const ks = ksRes.KSampler.input.required;
  fillOptions(document.getElementById("sampler"), ks.sampler_name[0]);
  fillOptions(document.getElementById("scheduler"), ks.scheduler[0]);

  const all = allModels();
  if (!keepSelection || !current || !all.some(m => m.kind === current.kind && m.name === current.name)) {
    current = all[0] || null;
  }
  renderModelCard(true);
}

function allModels() {
  if (!modelData) return [];
  return [
    ...modelData.checkpoints.map(m => ({ kind: "ckpt", arch: m.arch, name: m.name, folder: "checkpoints" })),
    ...modelData.diffusion_models.map(m => ({ kind: "dm", arch: m.arch, name: m.name, folder: "diffusion_models" })),
  ];
}

function fillOptions(el, items) {
  const prev = el.value;
  el.innerHTML = "";
  for (const it of items) {
    const o = document.createElement("option");
    o.value = o.textContent = it;
    el.appendChild(o);
  }
  if (prev && items.includes(prev)) el.value = prev;
}

// ---------- current model card ----------
function setThumb(el, kind, name, fallbackText, archColor) {
  el.textContent = "";
  el.style.backgroundImage = "";
  el.style.color = archColor;
  const url = imgUrlFor(kind, name);
  const probe = new Image();
  probe.onload = () => { el.style.backgroundImage = `url("${url}")`; };
  probe.onerror = () => { el.textContent = fallbackText; };
  probe.src = url;
}

function renderModelCard(applyDefaults) {
  const card = document.getElementById("modelCard");
  if (!current) {
    card.querySelector(".name").textContent = "モデルがありません";
    card.querySelector(".sub").textContent = "models フォルダに配置して再読込";
    document.getElementById("status").textContent =
      "モデルがありません。ComfyUI/models 配下に置いて「モデル再読込」を押してください。";
    return;
  }
  const a = ARCH[current.arch];
  const nameEl = card.querySelector(".name");
  nameEl.textContent = current.name.replace(/\.safetensors$/, "");
  nameEl.style.color = a.color;
  card.querySelector(".sub").innerHTML =
    `<span class="arch-pill" style="color:${a.color}">${a.label}</span>推奨: ${a.steps}steps / CFG ${a.cfg}`;
  setThumb(card.querySelector(".thumb"), current.folder, current.name, current.name[0].toUpperCase(), a.color);

  if (current.arch !== lastArch || applyDefaults) {
    lastArch = current.arch;
    document.getElementById("steps").value = a.steps;
    document.getElementById("cfg").value = a.cfg;
    const s = document.getElementById("sampler");
    if ([...s.options].some(o => o.value === a.sampler)) s.value = a.sampler;
    const sc = document.getElementById("scheduler");
    if ([...sc.options].some(o => o.value === a.scheduler)) sc.value = a.scheduler;
  }
  let warn = "";
  if ((current.arch === "anima" || current.arch === "z_image") && modelData) {
    const c = modelData.components[current.arch];
    if (!c.clip || !c.vae) {
      warn = `${a.label}に必要な部品が未配置です: ` +
        [!c.clip && "テキストエンコーダ", !c.vae && "VAE"].filter(Boolean).join(", ");
    }
  } else if (current.arch === "unknown") {
    warn = "このモデルの系統を判別できませんでした。生成に失敗する可能性があります。";
  }
  document.getElementById("status").textContent = warn;
}

// ---------- picker overlay ----------
function openPicker(mode) {  // "model" | "lora"
  const body = document.getElementById("overlayBody");
  document.getElementById("overlayTitle").textContent =
    mode === "model" ? "モデルを選択" : "LoRAを選択";
  body.innerHTML = "";

  const items = mode === "model"
    ? allModels()
    : modelData.loras.map(l => ({ kind: "lora", arch: l.arch, name: l.name, folder: "loras" }));

  for (const arch of ARCH_ORDER) {
    const group = items.filter(m => m.arch === arch);
    if (!group.length) continue;
    const a = ARCH[arch];
    const section = document.createElement("div");
    section.className = "arch-section";
    const h = document.createElement("h2");
    h.textContent = a.label;
    h.style.color = a.color;
    h.style.borderBottomColor = a.color;
    section.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "card-grid";
    for (const m of group) {
      const card = document.createElement("div");
      card.className = "model-card";
      if (mode === "model" && current && m.kind === current.kind && m.name === current.name) {
        card.classList.add("current");
      }
      const img = document.createElement("div");
      img.className = "img";
      setThumb(img, m.folder, m.name, m.name[0].toUpperCase(), a.color);
      const meta = document.createElement("div");
      meta.className = "meta";
      const nm = document.createElement("div");
      nm.className = "mname";
      nm.textContent = m.name.replace(/\.safetensors$/, "");
      nm.style.color = a.color;
      meta.appendChild(nm);
      card.append(img, meta);
      card.onclick = () => {
        if (mode === "model") {
          current = m;
          renderModelCard(false);
        } else {
          addLoraRow(m);
        }
        closePicker();
      };
      grid.appendChild(card);
    }
    section.appendChild(grid);
    body.appendChild(section);
  }
  if (!body.children.length) {
    body.innerHTML = `<div style="color:var(--dim)">ファイルがありません。models フォルダに置いて「モデル再読込」を押してください。</div>`;
  }
  document.getElementById("overlay").classList.add("open");
}
function closePicker() { document.getElementById("overlay").classList.remove("open"); }
document.getElementById("modelCard").onclick = () => modelData && openPicker("model");
document.getElementById("addLora").onclick = () => modelData && openPicker("lora");
document.getElementById("overlayClose").onclick = closePicker;
document.getElementById("overlay").onclick = e => { if (e.target.id === "overlay") closePicker(); };

// ---------- LoRA rows ----------
function addLoraRow(m) {
  const a = ARCH[m.arch];
  const row = document.createElement("div");
  row.className = "lora-row";
  row.dataset.name = m.name;
  const thumb = document.createElement("div");
  thumb.className = "thumb";
  setThumb(thumb, "loras", m.name, "", a.color);
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = m.name.replace(/\.safetensors$/, "");
  name.style.color = a.color;
  name.title = m.name;
  const st = document.createElement("input");
  st.type = "number"; st.value = "0.8"; st.step = "0.05"; st.min = "-2"; st.max = "2"; st.title = "強度";
  const del = document.createElement("button");
  del.textContent = "×";
  del.onclick = () => row.remove();
  row.append(thumb, name, st, del);
  document.getElementById("loras").appendChild(row);
}

// ---------- img2img reference ----------
let i2iImage = null;  // uploaded name on the server, or null for t2i
document.getElementById("i2iDrop").onclick = () => document.getElementById("i2iFile").click();
document.getElementById("i2iFile").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append("image", file);
  try {
    const r = await fetch(`${api}/upload/image`, { method: "POST", body: fd });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    i2iImage = j.name;
    document.getElementById("i2iThumb").src = URL.createObjectURL(file);
    document.getElementById("i2iBox").style.display = "flex";
    document.getElementById("i2iDrop").style.display = "none";
    document.getElementById("status").textContent =
      "参照画像セット済み。生成サイズは画像サイズがそのまま使われます。";
  } catch (err) {
    document.getElementById("status").textContent = "画像アップロード失敗: " + err.message;
  }
  e.target.value = "";
};
document.getElementById("i2iClear").onclick = () => {
  i2iImage = null;
  document.getElementById("i2iBox").style.display = "none";
  document.getElementById("i2iDrop").style.display = "block";
  document.getElementById("status").textContent = "";
};

// ---------- preset ----------
document.getElementById("preset").onchange = e => {
  if (!e.target.value) return;
  const [w, h] = e.target.value.split("x");
  document.getElementById("width").value = w;
  document.getElementById("height").value = h;
};

// ---------- settings ----------
/** Everything the workflow builder needs, read out of the left panel. */
function collectSettings() {
  const v = id => document.getElementById(id).value;
  return {
    model: current,
    loras: [...document.querySelectorAll(".lora-row")].map(row => ({
      name: row.dataset.name,
      strength: parseFloat(row.querySelector("input[type=number]").value) || 0,
    })),
    negative: v("negative"),
    width: parseInt(v("width")), height: parseInt(v("height")),
    batch: parseInt(v("batch")),
    steps: parseInt(v("steps")), cfg: parseFloat(v("cfg")),
    sampler: v("sampler"), scheduler: v("scheduler"),
  };
}

// ---------- prompt composition ----------
// The prompt box is what the user writes; the recipe draw is appended to it.
// Both the single shot and the batch runner go through here so they can never
// disagree about what was actually sent.
function userPrompt() {
  return (document.getElementById("prompt").value || "").trim().replace(/[,\s]+$/, "");
}

function composePrompt(recipeText) {
  const base = userPrompt();
  const extra = (recipeText || "").trim().replace(/^[,\s]+/, "");
  if (!base) return extra;
  if (!extra) return base;
  return base + ", " + extra;
}

function refreshComposed() {
  const on = Recipe.enabled() && Recipe.currentDraw();
  const wrap = document.getElementById("composedWrap");
  wrap.style.display = on ? "block" : "none";
  if (on) {
    document.getElementById("composedPreview").textContent =
      composePrompt(Recipe.currentDraw().prompt);
  }
}

document.getElementById("prompt").oninput = refreshComposed;

// ---------- generate ----------
const genBtn = document.getElementById("generate");
let lastRun = null;  // {started, images, cost} — feeds the batch time estimate

genBtn.onclick = async () => {
  if (!current) return;
  const s = collectSettings();
  const prompt = Recipe.enabled() && Recipe.currentDraw()
    ? composePrompt(Recipe.currentDraw().prompt)
    : document.getElementById("prompt").value;
  const seed = document.getElementById("randomSeed").checked
    ? Math.floor(Math.random() * 2 ** 48) : parseInt(document.getElementById("seed").value) || 0;
  document.getElementById("seed").value = seed;

  const opts = { ...s, prompt, seed, prefix: "studio" };
  if (i2iImage) {
    // single-shot img2img keeps the reference's own size, so no target given
    opts.i2iImage = i2iImage;
    opts.denoise = parseFloat(document.getElementById("i2iDenoise").value) || 0.6;
    opts.width = opts.height = undefined;
    lastRun = null;
  } else {
    lastRun = { started: Date.now(), images: s.batch, cost: s.width * s.height * s.steps };
  }

  genBtn.disabled = true;
  document.getElementById("interrupt").style.display = "block";
  document.getElementById("progressWrap").style.display = "block";
  document.getElementById("status").textContent = "キュー投入...";
  try {
    await enqueue(buildWorkflow(opts), clientId);
  } catch (e) {
    document.getElementById("status").textContent = "エラー: " + e.message;
    lastRun = null;
    resetUI();
  }
};
document.getElementById("interrupt").onclick = () => fetch(`${api}/interrupt`, { method: "POST" });
document.getElementById("refreshModels").onclick = () => loadModels(true);
document.getElementById("fetchPreviews").onclick = async () => {
  const btn = document.getElementById("fetchPreviews");
  btn.disabled = true; btn.textContent = "取得中...(初回はハッシュ計算で数分)";
  try {
    const r = await fetch(`${api}/studio/api/fetch_previews`, { method: "POST" });
    const j = await r.json();
    const fetched = Object.values(j).filter(v => v === "fetched").length;
    const missed = Object.entries(j).filter(([, v]) => v !== "fetched").map(([k]) => k);
    document.getElementById("status").textContent =
      `公式サムネ ${fetched}件取得` + (missed.length ? `／未取得: ${missed.join(", ")}` : "");
    await loadModels(true);
  } catch (e) {
    document.getElementById("status").textContent = "サムネ取得エラー: " + e.message;
  }
  btn.disabled = false; btn.textContent = "公式サムネ取得 (Civitai)";
};

function resetUI() {
  genBtn.disabled = false;
  document.getElementById("interrupt").style.display = "none";
  document.getElementById("progressWrap").style.display = "none";
  document.getElementById("progressBar").style.width = "0%";
}

/** Remember seconds-per-image so the batch runner can predict an overnight run.
 *  Stored with the pixel*step cost it was measured at, to scale to other sizes. */
function recordTiming() {
  if (!lastRun) return;
  const secs = (Date.now() - lastRun.started) / 1000 / lastRun.images;
  localStorage.setItem("sdstudio.secPerImage", String(secs));
  localStorage.setItem("sdstudio.refCost", String(lastRun.cost));
  lastRun = null;
  Recipe.updateEstimate();
}

// ---------- websocket: progress & results ----------
function imgUrl(im) {
  return `${api}/view?filename=${encodeURIComponent(im.filename)}&subfolder=${encodeURIComponent(im.subfolder)}&type=${im.type}`;
}
function showPreview(src) {
  document.getElementById("preview").innerHTML = `<img src="${src}">`;
}
function addToGallery(im) {
  const g = document.getElementById("gallery");
  const el = document.createElement("img");
  el.src = imgUrl(im) + "&preview=webp";
  el.onclick = () => {
    document.querySelectorAll("#gallery img").forEach(x => x.classList.remove("sel"));
    el.classList.add("sel");
    showPreview(imgUrl(im));
  };
  g.prepend(el);
}

let ws;
function connectWS() {
  ws = new WebSocket(`${api.replace("http", "ws")}/ws?clientId=${clientId}`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => document.getElementById("conn").textContent = "接続済み";
  ws.onclose = () => {
    document.getElementById("conn").textContent = "切断 - 再接続中...";
    setTimeout(connectWS, 2000);
  };
  ws.onmessage = ev => {
    if (ev.data instanceof ArrayBuffer) {
      const view = new DataView(ev.data);
      if (view.getUint32(0) === 1) {
        const fmt = view.getUint32(4) === 1 ? "image/jpeg" : "image/png";
        const blob = new Blob([ev.data.slice(8)], { type: fmt });
        showPreview(URL.createObjectURL(blob));
      }
      return;
    }
    const msg = JSON.parse(ev.data);
    if (msg.type === "progress") {
      const { value, max } = msg.data;
      document.getElementById("progressBar").style.width = (value / max * 100) + "%";
      document.getElementById("status").textContent = `生成中 ${value}/${max}`;
    } else if (msg.type === "executed" && msg.data.output?.images) {
      for (const im of msg.data.output.images) {
        if (im.type !== "output") continue;
        addToGallery(im);
        showPreview(imgUrl(im));
      }
    } else if (msg.type === "execution_success") {
      document.getElementById("status").textContent = "完了";
      recordTiming();
      if (Recipe.enabled()) Recipe.reroll();  // next draw is ready to fire
      resetUI();
    } else if (msg.type === "execution_error") {
      document.getElementById("status").textContent = "エラー: " + (msg.data.exception_message || "不明");
      resetUI();
    } else if (msg.type === "execution_interrupted") {
      document.getElementById("status").textContent = "中断しました";
      resetUI();
    }
  };
}

// ---------- restore recent history into gallery ----------
async function loadHistory() {
  try {
    const r = await fetch(`${api}/history?max_items=20`);
    const j = await r.json();
    for (const e of Object.values(j)) {
      for (const out of Object.values(e.outputs || {})) {
        for (const im of out.images || []) {
          if (im.type === "output") addToGallery(im);
        }
      }
    }
  } catch (_) { /* history is best-effort */ }
}

Recipe.init({
  clientId,
  getSettings: collectSettings,
  setStatus: msg => { document.getElementById("status").textContent = msg; },
  // The draw no longer overwrites the box — rerolling must not wipe what the
  // user typed. Both sides share these two so the batch cannot drift.
  refreshComposed,
  userPrompt,
  composePrompt,
});

loadModels(false).then(() => {
  loadHistory();
  const p = new URLSearchParams(location.search).get("picker");
  if (p === "models") openPicker("model");
  if (p === "loras") openPicker("lora");
});
connectWS();
</script>
