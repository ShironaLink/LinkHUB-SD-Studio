<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SD Studio — 詠唱補助装置</title>
<style>
  :root {
    --bg: #0f0f10; --panel: #171719; --panel2: #1e1e21;
    --border: #2a2a2e; --text: #e6e6e8; --dim: #8a8a92;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    display: flex; flex-direction: column;
  }
  #top {
    display: flex; align-items: center; gap: 10px; padding: 9px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel); flex-shrink: 0;
  }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  button:hover { border-color: #555; }
  #top .spacer { flex: 1; }
  .note { color: var(--dim); font-size: 11px; }
  /* The tool is a self-contained page from its own repo, so it is embedded
     rather than copied — that keeps `git pull` working as its update path. */
  #frame { flex: 1; border: 0; width: 100%; display: block; }
</style>
</head>
<body>

<div id="top">
  <button onclick="location.href='/studio'">← 生成に戻る</button>
  <button onclick="location.href='/studio/review'">選別ビュー</button>
  <span class="spacer"></span>
  <span class="note">組んだ呪文はプロンプト欄に貼れば、レシピの抽選分が後ろに連結されます</span>
  <button onclick="document.getElementById('frame').contentWindow.location.reload()">再読込</button>
</div>

<iframe id="frame" src="/studio/prompt/app/" allow="clipboard-write; clipboard-read"></iframe>

</body>
</html>
